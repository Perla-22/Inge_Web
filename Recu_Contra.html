<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form>
        <h2>Recuperar contraseña</h2>
        <label for="usuario">Usuario:</label><br>
        <input type="text" id="usuario" name="usuario"><br><br>
        <label for="recuPassword">Nueva contraseña:</label><br>
        <input type="password" id="recuPassword" name="recuPassword"><br><br>
        <label for="confirmarPassword">Confirmar contraseña:</label><br>
        <input type="password" id="confirmarPassword" name="confirmarPassword"><br><br>
        <button type="submit">Recuperar contraseña</button><br><br>

        <a href="Login.html">Volver al login</a>
    </form>
</body>
</html>
